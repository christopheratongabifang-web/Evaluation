{% extends 'base.html' %}

{% block content %}
<div class="header-actions">
    <div>
        <h1 style="font-size: 2rem;">Messages</h1>
        <p style="color: var(--text-secondary); margin-top: 0.5rem;">Send private messages to students</p>
    </div>
    <div style="display: flex; gap: 0.75rem; align-items: center;">
        <form method="POST" action="{{ url_for('clear_all_messages') }}" onsubmit="return confirm('Are you sure you want to delete ALL messages (including broadcasts) from the system? This cannot be undone.')">
            <button type="submit" class="btn btn-danger">
                <i class="fa-solid fa-trash me-1"></i> Clear All Messages & Broadcasts
            </button>
        </form>
        <a href="{{ url_for('admin_dashboard') }}" class="btn btn-outline">
            <i class="fa-solid fa-arrow-left"></i> Back to Dashboard
        </a>
    </div>
</div>

<div style="display: grid; grid-template-columns: 300px 1fr; gap: 1.5rem; margin-top: 1.5rem;">
    <!-- Students List -->
    <div class="glass" style="padding: 1.5rem; height: fit-content;">
        <h2 style="margin-top: 0;">Students</h2>
        <div style="display: flex; flex-direction: column; gap: 0.5rem;">
            {% for student in students %}
            <a href="#student-{{ student.id }}" onclick="selectStudent(this)" 
               data-student-id="{{ student.id }}"
               data-student-name="{{ student.username }}"
               class="btn btn-outline" style="text-align: left; justify-content: flex-start;">
                <i class="fa-solid fa-user"></i> {{ student.username }}
            </a>
            {% endfor %}
        </div>
    </div>

    <!-- Conversation -->
    <div id="conversation-panel" class="glass" style="padding: 1.5rem; display: none; flex-direction: column;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
            <h2 id="student-name" style="margin: 0;"></h2>
            <div style="display: flex; gap: 0.5rem;">
                <form id="clear-form" method="POST" style="margin: 0;" onsubmit="return confirm('Are you sure you want to delete all messages in this conversation?')">
                    <button type="submit" class="btn btn-sm btn-danger" style="padding: 0.5rem 1rem;"><i class="fa-solid fa-trash me-1"></i> Clear Chat</button>
                </form>
                <button onclick="closeConversation()" class="btn btn-outline" style="padding: 0.5rem 1rem;">Close</button>
            </div>
        </div>

        <div id="messages-container" style="flex: 1; overflow-y: auto; margin-bottom: 1rem; max-height: 400px; padding: 1rem; background: var(--surface); border-radius: 0.75rem; border: 1px solid var(--surface-border);">
            <!-- Messages will be loaded here -->
        </div>

        <form id="message-form" method="POST" onsubmit="sendMessage(event)" style="display: flex; gap: 0.5rem;">
            <textarea name="content" placeholder="Type your message..." required style="flex: 1; min-height: 80px; padding: 0.75rem; border: 1px solid var(--surface-border); border-radius: 0.5rem; background: var(--surface); color: var(--text);"></textarea>
            <button type="submit" class="btn btn-primary" style="align-self: flex-end;">Send</button>
        </form>
    </div>

    {% if not students %}
    <div class="glass" style="padding: 1.5rem; grid-column: 2;">
        <p style="color: var(--text-secondary); text-align: center;">No students registered yet.</p>
    </div>
    {% endif %}
</div>

<script>
let currentStudentId = null;

function selectStudent(button) {
    const studentId = button.dataset.studentId;
    const studentName = button.dataset.studentName || '';
    currentStudentId = studentId;
    document.getElementById('student-name').textContent = studentName;
    document.getElementById('clear-form').action = '/clear_conversation/' + studentId;
    document.getElementById('conversation-panel').style.display = 'flex';
    loadMessages(studentId, studentName);
}

function closeConversation() {
    document.getElementById('conversation-panel').style.display = 'none';
    currentStudentId = null;
}

function loadMessages(studentId, studentName) {
    const container = document.getElementById('messages-container');
    container.innerHTML = '';
    const conversation = (window.studentConversations || {})[studentId] || [];
    if (!conversation.length) {
        container.innerHTML = '<p style="color: var(--text-secondary);">No messages yet.</p>';
        return;
    }

    conversation.forEach(msg => {
        const messageDiv = document.createElement('div');
        messageDiv.style.marginBottom = '0.75rem';
        messageDiv.style.padding = '0.75rem';
        messageDiv.style.borderRadius = '0.5rem';
        messageDiv.style.background = msg.is_me ? 'var(--primary)' : 'var(--surface-border)';
        messageDiv.style.color = 'var(--text)';
        messageDiv.style.position = 'relative';

        const deleteForm = document.createElement('form');
        deleteForm.style.position = 'absolute';
        deleteForm.style.top = '0.5rem';
        deleteForm.style.right = '0.5rem';
        deleteForm.style.margin = '0';
        deleteForm.onsubmit = event => deleteMessage(event, msg.id);

        const deleteButton = document.createElement('button');
        deleteButton.type = 'submit';
        deleteButton.className = 'btn btn-sm';
        deleteButton.style.padding = '0.15rem 0.4rem';
        deleteButton.style.background = 'rgba(0,0,0,0.3)';
        deleteButton.style.color = 'white';
        deleteButton.style.border = 'none';
        deleteButton.style.borderRadius = '0.25rem';
        deleteButton.title = 'Delete Message';
        deleteButton.innerHTML = '<i class="fa-solid fa-xmark"></i>';
        deleteForm.appendChild(deleteButton);

        const senderStrong = document.createElement('strong');
        senderStrong.style.display = 'block';
        senderStrong.style.fontSize = '0.85rem';
        senderStrong.style.marginBottom = '0.25rem';
        senderStrong.style.paddingRight = '2rem';
        senderStrong.textContent = msg.is_me ? 'You' : studentName;

        const contentDiv = document.createElement('div');
        contentDiv.textContent = msg.content;

        const timestamp = document.createElement('span');
        timestamp.style.display = 'block';
        timestamp.style.fontSize = '0.75rem';
        timestamp.style.color = 'var(--text-secondary)';
        timestamp.style.marginTop = '0.25rem';
        timestamp.textContent = msg.created_at;

        messageDiv.appendChild(deleteForm);
        messageDiv.appendChild(senderStrong);
        messageDiv.appendChild(contentDiv);
        messageDiv.appendChild(timestamp);

        container.appendChild(messageDiv);
    });

    container.scrollTop = container.scrollHeight;
}

function sendMessage(event) {
    event.preventDefault();
    if (!currentStudentId) return;
    
    const form = document.getElementById('message-form');
    const formData = new FormData(form);
    
    fetch(`/send_message/${currentStudentId}`, {
        method: 'POST',
        body: formData
    }).then(response => {
        if (response.ok) {
            form.reset();
            location.reload();
        }
    });
}

function deleteMessage(event, msgId) {
    event.preventDefault();
    if (!confirm('Delete this message?')) return;
    
    fetch(`/delete_message/${msgId}`, {
        method: 'POST'
    }).then(() => {
        location.reload();
    });
}

window.addEventListener('load', function() {
    if (window.location.hash && window.location.hash.startsWith('#student-')) {
        const studentId = window.location.hash.replace('#student-', '');
        const studentLink = document.querySelector(`a[href="#student-${studentId}"]`);
        if (studentLink) {
            studentLink.click();
        }
    }
});

window.studentConversations = window.studentConversations || {};
{% for student_id, (student, msgs) in conversations.items() %}
window.studentConversations[{{ student_id }}] = [
    {% for msg in msgs %}{
        sender_id: {{ msg.sender_id }},
        id: {{ msg.id }},
        content: {{ msg.content|tojson }},
        created_at: {{ msg.created_at.strftime('%b %d, %I:%M %p')|tojson }},
        is_me: {{ 'true' if msg.sender_id == current_user.id else 'false' }}
    }{% if not loop.last %},{% endif %}
    {% endfor %}
];
{% endfor %}
</script>

{% endblock %}
